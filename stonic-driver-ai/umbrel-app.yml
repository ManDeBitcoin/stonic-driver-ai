id: stonic-driver-ai
name: Stonic Driver AI
tagline: Bitácora personal y asistente de conducción para Kia Stonic en Guayaquil
icon: https://raw.githubusercontent.com/ManDeBitcoin/stonic-driver-ai/main/assets/icon.png
category: personal
version: "0.1.0"
port: 5174
description: >-
  Stonic Driver AI es tu bitácora personal y copiloto para el registro eficiente de jornadas,
  combustible y viajes con tu Kia Stonic en Guayaquil.

  Características principales:
  • Importación inteligente de reportes CSV de Uber Driver (detección automática de columnas, comisiones y vista previa con resolución de duplicados).
  • Registro diario de jornadas: viajes completados, horas trabajadas, kilometraje e ingresos netos.
  • Historial de abastecimiento de combustible, control de odómetro y precio por galón en USD.
  • Métricas claras de desempeño: ingresos por hora, saldo registrado y resúmenes semanales.
  • 100% privado, local y soberano: tus datos se ejecutan en tu propio Umbrel OS bajo tu control.
