releaseNotes: |-
  Versión 0.1.0

  - Primera versión para producción en Umbrel OS.
  - Módulo de importación automática de reportes CSV de Uber Driver (viaje por viaje o consolidado diario).
  - Interfaz web PWA responsiva accesible de forma remota vía Tailscale desde el celular.
  - Arquitectura en contenedor Docker con servidor Nginx optimizado y compresión gzip.
