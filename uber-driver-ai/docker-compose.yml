version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: uber-driver-ai_web_1
      APP_PORT: 80

  web:
    image: ghcr.io/mandebitcoin/uber-driver-ai:0.1.1
    restart: on-failure
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
