description: >-
  Uber Driver AI es tu bitácora personal y copiloto para el registro eficiente de jornadas,
  combustible y viajes en Guayaquil.

  Características principales:
  • Diseñada desde cero: perfecta para comenzar a registrar desde tu primer viaje y compra de gasolina.
  • Registro manual ágil: fecha, horas trabajadas, kilómetros, viajes completados e ingresos netos en USD.
  • Historial y control de combustible: galones cargados, odómetro y costo por galón en tiempo real.
  • Métricas clave: ingresos por hora, saldo registrado y gráficos de desempeño semanal.
  • Importación preparada de reportes CSV de Uber Driver cuando descargues tus extractos oficiales.
  • Soberana y privada: se ejecuta en tu propio servidor Umbrel OS bajo tu control.
