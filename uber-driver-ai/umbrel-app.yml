id: uber-driver-ai
name: Uber Driver AI
tagline: Bitácora personal y copiloto privado para Uber
icon: https://raw.githubusercontent.com/ManDeBitcoin/uber-driver-ai/main/assets/icon.png
category: personal
version: "0.1.2"
port: 5174
description: >-
  Uber Driver AI es tu bitácora personal y copiloto privado para el registro eficiente de jornadas,
  combustible y viajes al volante.

  Características principales:
  • Diseñada desde cero: perfecta para comenzar a registrar desde tu primer viaje y compra de gasolina.
  • Personalización de vehículo y ubicación: añade tu vehículo y ciudad guardados localmente para mayor privacidad.
  • Registro manual ágil: fecha, horas trabajadas, kilómetros, viajes completados e ingresos netos en USD.
  • Historial y control de combustible: galones cargados, odómetro y costo por galón en tiempo real.
  • Métricas clave: ingresos por hora, saldo registrado y gráficos de desempeño semanal.
  • Importación preparada de reportes CSV de Uber Driver con vista previa y deduplicación.
  • Soberana y privada: se ejecuta en tu propio servidor Umbrel OS bajo tu control.
